name: Deploy project preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify root-path build and tests
        run: npm run build && npm test
      - name: Build project-path preview
        run: npm run build
        env:
          ZZOO_GITHUB_PAGES: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Prepare public artifact without original model
        run: |
          mkdir -p _site
          rsync -a --exclude='/watch-demo/model.glb' --exclude='/.assetsignore' dist/ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
